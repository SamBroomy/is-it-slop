name: Android

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yaml"
  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yaml"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  build-aar:
    name: Build and test AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2.9.1

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973

      - uses: gradle/actions/setup-gradle@v4

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust glue tests
        run: cargo test -p is-it-slop-android --locked

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build AAR
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: is-it-slop-aar
          path: android/library/build/outputs/aar/library-release.aar

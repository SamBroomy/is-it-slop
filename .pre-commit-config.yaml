repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: sync-notebooks
        name: Sync notebooks to scripts
        entry: just sync-notebooks
        language: system
        files: \.ipynb$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # - id: no-commit-to-branch
      #   args: [--branch, main]
      #   stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        args: ["--maxkb=500"]
        exclude: '^(plots/.*\.png|uv\.lock)$' # Exclude plots and uv.lock
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^notebooks/.*\.py$' # Exclude synced notebook scripts
      - id: mixed-line-ending
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: '^notebooks/.*\.py$' # Exclude synced notebook scripts

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.19
    hooks:
      - id: uv-sync
        args: ["--locked", "--all-packages"]
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --unsafe-fixes]
        types_or: [python]
        stages: [pre-commit]
        files: '^python/.*\.py$'
        types: [python]
      - id: ruff-format
        name: ruff format
        files: '^python/.*\.py$'
        types: [python]

  - repo: local
    hooks:
      # Justfile hooks
      - id: just-fmt
        name: just fmt
        entry: just --unstable --fmt
        language: system
        files: ^justfile$
        stages: [pre-commit]
        pass_filenames: false
      # Cargo shear (only when Cargo.toml changes)
      - id: cargo-shear
        name: cargo shear
        description: Find unused dependencies
        entry: cargo shear --deny-warnings --fix
        language: system
        files: '^Cargo\.toml$'
        types: [toml]
        pass_filenames: false
      # Cargo audit (only when Cargo.lock changes or on manual trigger)
      - id: cargo-audit
        name: cargo audit
        description: Audit for security vulnerabilities
        entry: cargo audit --deny unsound --deny yanked
        language: system
        files: '^Cargo\.lock$'
        types: [toml]
        pass_filenames: false
        stages: [manual, pre-push]
      # Clippy (only on Rust files or Cargo.toml changes)
      - id: cargo-clippy
        name: cargo clippy
        description: Run cargo clippy with fixes (multiple feature sets)
        entry: cargo clippy --fix --allow-staged --all-targets --workspace -- -D warnings
        language: system
        files: '(\.rs$|Cargo\.toml$|Cargo\.lock$)'
        types_or: [rust, toml]
        pass_filenames: false
      # Cargo fmt (only on Rust files)
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with cargo fmt
        entry: cargo +nightly fmt --all
        language: system
        files: '\.rs$'
        types: [rust]
        pass_filenames: false
      - id: taplo-fmt
        name: taplo fmt
        description: Format TOML files with taplo
        entry: taplo format
        language: system
        files: '\.toml$'
        types: [toml]
        pass_filenames: false
      # Cargo doc (documentation check)
      - id: cargo-doc
        name: cargo doc
        description: Check documentation builds
        entry: cargo doc --all-features --workspace --no-deps
        language: system
        files: '(\.rs$|Cargo\.toml$|Cargo\.lock$)'
        types: [rust, toml]
        pass_filenames: false

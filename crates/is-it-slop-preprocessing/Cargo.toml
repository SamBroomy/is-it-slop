[package]
name = "is-it-slop-preprocessing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Preprocessing step for is-it-slop package, providing fast TF-IDF vectorization."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "is_it_slop_preprocessing"
crate-type = ["cdylib", "rlib"]


[dependencies]
ahash = { workspace = true }
bincode = { workspace = true, optional = true }
bpe-openai = { workspace = true }
dashmap = { workspace = true, features = ["rayon"] }
indicatif = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
numpy = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
# pyo3-log = { workspace = true, optional = true }
rayon = { workspace = true }
regex = { workspace = true }
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sprs = { workspace = true }
tracing = { workspace = true }

[features]
default = ["rkyv"]
python = [
    "bincode",
    "mimalloc",
    "numpy",
    "progress-bars",
    "pyo3",
    # "pyo3-log",
    "rkyv",
    "serde",
]
bincode = ["dep:bincode"]
mimalloc = ["dep:mimalloc"]
progress-bars = ["dep:indicatif"]
rkyv = ["dep:rkyv"]
serde = ["dep:serde", "dep:serde_json"]

all-testable = ["serde", "rkyv", "bincode"]

[dev-dependencies]
csv = "1.4"
mimalloc = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

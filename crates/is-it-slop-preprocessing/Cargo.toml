[package]
name = "is-it-slop-preprocessing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Preprocessing for is-it-slop: text cleaning, BPE tokenization, and chunking."
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "is_it_slop_preprocessing"
crate-type = ["cdylib", "rlib"]


[dependencies]
bpe-openai = { workspace = true }
indicatif = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-log = { workspace = true, optional = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = []
python = ["progress-bars", "dep:pyo3", "dep:pyo3-log"]
progress-bars = ["dep:indicatif"]
serde = ["dep:serde", "dep:serde_json"]

all-testable = ["serde"]

[lints]
workspace = true

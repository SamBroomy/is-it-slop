[package]
name = "is-it-slop-preprocessing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Preprocessing for is-it-slop: text cleaning, BPE tokenization, and chunking."
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bpe-openai = { workspace = true }
pyo3 = { workspace = true, optional = true }
rayon = { workspace = true }
regex = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Python bindings (built by python/preprocessing); internal, for the data pipeline.
python = ["dep:pyo3"]
all-testable = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

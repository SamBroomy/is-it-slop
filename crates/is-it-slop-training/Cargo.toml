[package]
name = "is-it-slop-training"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Burn training pipeline for the is-it-slop classifier."
categories.workspace = true
keywords.workspace = true
publish = false

[features]
default = []
# Backends are additive and chosen at runtime (`--backend`, default: the best one compiled in) —
# see src/backend.rs for the priority order. Flex (pure-Rust CPU) is always available.
metal = ["burn/metal"]
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
vulkan = ["burn/vulkan"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { workspace = true, features = [
    "std",
    "autodiff",
    "train",
    "tui",
    "flex",
    "safetensors",
    "autotune",
    "fusion",
] }
clap = { workspace = true }
is-it-slop-model = { workspace = true }
is-it-slop-preprocessing = { workspace = true }
polars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
safetensors = { workspace = true }

[lints]
workspace = true

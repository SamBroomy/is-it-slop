[package]
name = "is-it-slop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# Model artifacts are downloaded at build time if not present
# See build.rs for download logic
exclude = ["model_artifacts/**", "benches/**", "tests/fixtures/**"]

[lib]
name = "is_it_slop"
filename = "is_it_slop_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
is-it-slop-model = { workspace = true }
is-it-slop-preprocessing = { workspace = true }

burn = { workspace = true, features = ["std", "flex"] }
burn-store = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# CLI-only dependencies
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
supports-color = { workspace = true, optional = true }
# Install source detection dependencies
dirs = { workspace = true }
which = { workspace = true }
# Python bindings dependencies
pyo3 = { workspace = true, optional = true }
# pyo3-log = { workspace = true, optional = true }
# Android JNI bindings
jni = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "is-it-slop"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[bench]]
name = "inference"
harness = false

[features]
default = ["cli"]
python = ["pyo3"]
pyo3 = ["dep:pyo3"]
cli = ["dep:clap", "serde", "dep:anyhow", "dep:owo-colors", "dep:supports-color"]
serde = ["dep:serde"]
# Enable self-update for standalone binaries (not package manager installs).
self-update = []
# Inference backends. Default is Flex, burn's pure-Rust CPU backend; `cpu` (burn-cpu, the CubeCL CPU
# runtime) and `ndarray` are the other CPU choices; the rest are accelerators and switch the
# scheduling policy (see `pipeline::Strategy`). Only Flex is exercised in CI; `metal` and `wgpu`
# have been run locally, the others only compile-checked. Precedence when several are enabled:
# cuda, rocm, metal, vulkan, webgpu, wgpu, cpu, ndarray, flex. `metal` implies `wgpu` in burn and
# `vulkan`/`webgpu` do too; see `model::Backend`.
wgpu = ["burn/wgpu"]
metal = ["burn/metal"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
cpu = ["burn/cpu"]
ndarray = ["burn/ndarray"]
# Build with empty model artifacts (for docs, won't work at runtime)
stub-model = []

# Android JNI bindings for mobile integration
jni = ["dep:jni", "serde"]


all-testable = ["cli"] # add other features here, but NOT python

[package.metadata.docs.rs]
features = ["stub-model"]

[build-dependencies]
directories = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[package]
name = "is-it-slop"
version = "0.6.3"
edition = "2024"
authors = ["SamBroomy <36888606+SamBroomy@users.noreply.github.com>"]
license = "MIT"
description = "Detect AI-generated slop text using machine learning."
repository = "https://github.com/SamBroomy/is-it-slop"
readme = "README.md"
keywords = [
    "AI-text-detector",
    "Machine-learning",
    "onnx",
    "text-classification",
    "ai-slop-detector",
]
categories = [
    "algorithms",
    "command-line-utilities",
    "science",
    "text-processing",
]
rust-version = "1.95"
# Model artifacts are downloaded at build time if not present
# See build.rs for download logic
exclude = ["model_artifacts/**"]

[lib]
name = "is_it_slop"
filename = "is_it_slop_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
is-it-slop-preprocessing = { path = "../is-it-slop-preprocessing", version = "=0.6.3", features = ["serde"] }

ndarray = "0.17"
serde = { version = "1.0.228", features = ["derive"], optional = true }
sprs = "0.11"
thiserror = "2.0.18"
# CLI-only dependencies
anyhow = { version = "1.0.100", optional = true }
clap = { version = "4.5.53", features = ["derive", "env"], optional = true }
owo-colors = { version = "4.3", features = ["supports-colors"], optional = true }
serde_json = { version = "1.0", optional = true }
# Install source detection dependencies
dirs = "6.0"
which = "8.0"
# Python bindings dependencies
pyo3 = { version = "0.28", default-features = false, features = [
    "extension-module",
    "macros",
], optional = true }
# On Android: use load-dynamic instead of download-binaries.
# ONNX Runtime shared library must be bundled in the Android APK.
# api-24 is needed because `load-dynamic` compiles all EP modules, and
# ort-sys fields like SessionOptionsAppendExecutionProvider_VitisAI require
# api-18+. Without api-24 those fields are missing from OrtApi at compile time.
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "ndarray",
    "load-dynamic",
    "tracing",
    "api-24",
] }
# Non-Android: download ONNX Runtime binary at build time with TLS support
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "download-binaries",
    "ndarray",
    "tls-native",
    "tracing",
] }

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "is-it-slop"
required-features = ["cli"]

[features]
default = ["cli"]
python = ["pyo3"]
pyo3 = ["dep:pyo3"]
cli = ["dep:clap", "serde", "dep:anyhow", "dep:owo-colors"]
serde = ["dep:serde", "dep:serde_json"]
# Enable self-update for standalone binaries (not package manager installs).
self-update = []
# Build with empty model artifacts (for docs, won't work at runtime)
stub-model = []
all-testable = ["cli"] # add other features here, but NOT python

[package.metadata.docs.rs]
features = ["stub-model"]

[build-dependencies]
directories = "6"
flate2 = "1.1.5"
tar = "0.4.45"
tempfile = "3.23.0"
ureq = "3.1.4"


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

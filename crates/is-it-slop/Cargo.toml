[package]
name = "is-it-slop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# Model artifacts are downloaded at build time if not present
# See build.rs for download logic
exclude = ["model_artifacts/**", "benches/**", "tests/fixtures/**"]

[lib]
name = "is_it_slop"
filename = "is_it_slop_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
is-it-slop-model = { workspace = true }
is-it-slop-preprocessing = { workspace = true }

burn = { workspace = true, features = ["std", "flex"] }
burn-store = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# CLI-only dependencies
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
supports-color = { workspace = true, optional = true }
# Install source detection dependencies
dirs = { workspace = true }
which = { workspace = true }
# Python bindings dependencies
pyo3 = { workspace = true, optional = true }
# pyo3-log = { workspace = true, optional = true }
# Android JNI bindings
jni = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "is-it-slop"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[bench]]
name = "inference"
harness = false

[features]
default = ["cli"]
python = ["pyo3"]
pyo3 = ["dep:pyo3"]
cli = ["dep:clap", "serde", "dep:anyhow", "dep:owo-colors", "dep:supports-color"]
serde = ["dep:serde"]
# Enable self-update for standalone binaries (not package manager installs).
self-update = []
# Inference backends. The primary backend is chosen by precedence: cuda, rocm, metal, vulkan, webgpu,
# wgpu (accelerators, which set `cfg(accelerated)` and batch documents per pass), then the CPU
# backend: cpu (burn-cpu), ndarray (which `accelerate` implies), else Flex, burn's pure-Rust CPU
# backend. An accelerated build also keeps the CPU backend's model and routes small calls to it. Only
# Flex runs in CI; flex, ndarray, accelerate, apple-amx, wgpu, metal and webgpu have been run locally;
# cuda and rocm only compile-checked; vulkan needs the Vulkan SDK on macOS; cpu (burn-cpu) currently
# aborts on its first forward. `metal`, `vulkan` and `webgpu` imply `wgpu` in burn; see `model::Backend`.
wgpu = ["burn/wgpu"]
metal = ["burn/metal"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
cpu = ["burn/cpu"]
ndarray = ["burn/ndarray"]
# CPU variants. `accelerate` links the macOS Accelerate framework unconditionally, so it fails to
# link on any other OS; `apple-amx` is a no-op off aarch64. Both were run locally on Apple silicon.
accelerate = ["ndarray", "burn/accelerate"]
apple-amx = ["burn/apple-amx"]
# Build with empty model artifacts (for docs, won't work at runtime)
stub-model = []

# Android JNI bindings for mobile integration
jni = ["dep:jni", "serde"]


# The feature set CI builds, tests and docs with. `--all-features` is never a valid build of this
# crate: `python` links as an extension module, the backends are mutually exclusive platform choices,
# and `vulkan` needs the Vulkan SDK on macOS.
all-testable = ["cli", "jni", "self-update"]

[package.metadata.docs.rs]
features = ["stub-model"]

[build-dependencies]
directories = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[package]
name = "is-it-slop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# Model artifacts are downloaded at build time if not present
# See build.rs for download logic
exclude = ["model_artifacts/**"]

[lib]
name = "is_it_slop"
filename = "is_it_slop_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
is-it-slop-preprocessing = { workspace = true, features = ["serde"] }

ndarray = { workspace = true }
ort = { workspace = true }
serde = { workspace = true, optional = true }
sprs = { workspace = true }
thiserror = { workspace = true }
# CLI-only dependencies
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Install source detection dependencies
dirs = { workspace = true }
which = { workspace = true }
# Python bindings dependencies
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "is-it-slop"
required-features = ["cli"]

[features]
default = ["download-binaries", "cli"]
python = ["pyo3"]
pyo3 = ["dep:pyo3"]
cli = ["dep:clap", "serde", "dep:anyhow", "dep:owo-colors"]
serde = ["dep:serde", "dep:serde_json"]
self-update = []
stub-model = []

# Downloads prebuilt ONNX Runtime binaries at build time (default).
download-binaries = ["ort/download-binaries", "ort/tls-native"]

# Loads ONNX Runtime dynamically at runtime (for platforms without prebuilt binaries, e.g. Android).
# The shared library must be bundled by the consumer (e.g. via Gradle/Maven).
load-dynamic = ["ort/load-dynamic", "ort/api-24"]

all-testable = ["download-binaries", "cli"]

[package.metadata.docs.rs]
features = ["stub-model"]

[build-dependencies]
directories = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

jdk:
  - openjdk17
before_install: |
  echo "sdk.dir=$ANDROID_HOME" > local.properties
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
  . "$HOME/.cargo/env"
  rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
  if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
    echo "NDK 27 not found, downloading..."
    curl -L -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27-linux.zip
    mkdir -p "$ANDROID_HOME/ndk"
    unzip -q /tmp/ndk.zip -d /tmp/ndk/
    mv /tmp/ndk/android-ndk-r27 "$ANDROID_HOME/ndk/27.0.12077973"
    rm -f /tmp/ndk.zip
  fi
install:
  - ./gradlew :library:publishReleasePublicationToMavenLocal

[project]
name = "is-it-slop-package"
version = "0.4.0"
description = "Extremely fast embedded AI text detector, using classic ML, written and served in rust."
authors = [
    { name = "SamBroomy", email = "36888606+SamBroomy@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = [
    "AI-text-detector",
    "ML",
    "Tokenization",
    "ai-detection",
    "machine-learning",
    "pyo3",
    "rust",
    "text-classification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
license = { file = "./LICENSE" }
readme = { file = "./README.md", content-type = "text/markdown" }


dependencies = [
    "is-it-slop",
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "kagglehub>=1.0.0",
    "loguru>=0.8.0",
    "numpy>=2",
    "polars>=2",
    "safetensors>=0.8.0",
    "semver>=3.0.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7",
    "jupytext>=1.18.1",
    "maturin>=1.10.2",
    "nbconvert>=7.16.6",
    "nbstripout>=0.8.2",
    "prek>=0.3.8",
    "pytest>=9.0.1",
    "ruff>=0.14.0",
    "ty>=0.0.34",
]

[project.urls]
Homepage = "https://github.com/SamBroomy/is-it-slop"
Documentation = "https://github.com/SamBroomy/is-it-slop/blob/main/README.md"
Repository = "https://github.com/SamBroomy/is-it-slop"
Issues = "https://github.com/SamBroomy/is-it-slop/issues"


[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/is-it-slop"]

[tool.uv.sources]
is-it-slop = { workspace = true }

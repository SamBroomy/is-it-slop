# Workspace root: the code lives in the members under python/; this file ties them together and
# holds the tooling shared across the repo.

[tool.uv.workspace]
members = ["python/is-it-slop", "python/preprocessing", "python/curation"]

# The compiled extension has no Python source; its type stub lives outside the package.
[tool.ty.environment]
extra-paths = ["python/preprocessing/stubs"]

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.110",
]

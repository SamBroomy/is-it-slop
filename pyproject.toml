# Workspace root: the code lives in the members under python/; this file ties them together and
# holds the tooling shared across the repo.

[tool.uv.workspace]
members = ["python/is-it-slop", "python/curation"]

# scripts/ are standalone PEP 723 scripts: their dependencies are not in this environment.
[tool.ty.src]
exclude = ["scripts"]

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.110",
]

# ---------------------------------------------------------------------------------------------
# Mixed human/AI sources
# ---------------------------------------------------------------------------------------------

[[source]]
name = "raid"
loader = "files"
repo = "liamdugan/raid"
files = ["train.csv"]
text_column = "generation"
keep = { model = [
    "human",
    "gpt4",
    "cohere-chat",
    "chatgpt",
    "gpt3",
    "llama-chat",
    "mistral-chat",
] }
label_column = "model"
human_value = "human"
generator_column = "model"
domain_column = "domain"
attack_column = "attack"
group_column = "source_id" # every model/attack variant of one source document stays in one split
take = { each = 50000 }
flatten_paragraphs = true # human text has no paragraph breaks, the AI text does

# Two files, each with its own documented generator (see the dataset card).
[[source]]
name = "human_vs_machine-wiki"
loader = "files"
repo = "NicolaiSivesind/human-vs-machine"
files = ["wiki-labeled.csv"]
label_column = "label"
generator = "text-curie-001"
domain = "wiki"
requires = "hf_token"                     # gated dataset
take = { each = 13500 }
flatten_paragraphs = true

[[source]]
name = "human_vs_machine-abstracts"
loader = "files"
repo = "NicolaiSivesind/human-vs-machine"
files = ["research-abstracts-labeled.csv"]
label_column = "label"
generator = "gpt-3.5-turbo-0301"
domain = "abstracts"
requires = "hf_token"
take = { each = 13500 }
flatten_paragraphs = true

[[source]]
name = "daigt-v2-train-dataset"
loader = "kaggle"
handle = "thedrcat/daigt-v2-train-dataset"
file = "train_v2_drcat_02.csv"
label_column = "label"
generator_column = "source"                # the model for AI rows (human rows are blanked)
domain = "student_essay"
requires = "kaggle"
take = { 0 = 25000, 1 = "all" }

[[source]]
name = "AI-and-Human-Generated-Text"
loader = "files"
repo = "Ateeqq/AI-and-Human-Generated-Text"
files = ["train.csv", "test.csv"]
text_column = "abstract"
label_column = "label"
generator = "gpt-3"
trim_fragments = "start"                    # 44% of the AI text starts mid-sentence, 1% of the human text
take = "all"

[[source]]
name = "AI_Human_generated_movie_reviews"
loader = "files"
repo = "Milkyway-islander/AI_Human_generated_movie_reviews"
files = ["data/*.parquet"]
label_column = "labels"
generator_column = "models"
domain = "movie_review"
take = "all"

[[source]]
name = "human_vs_ai_sentences"
loader = "files"
repo = "shahxeebhassan/human_vs_ai_sentences"
files = ["complete_dataset.csv"]
label_column = "label"
take = { each = 7500 }

[[source]]
name = "MAGE"
loader = "files"
repo = "yaful/MAGE"                                                   # human and 27 older models over 10 domains; the text is normalised (ASCII)
files = ["train.csv", "valid.csv", "test.csv"]
label_column = "label"
human_value = 1                                                       # MAGE labels human text 1 and machine text 0
generator_column = "src"
generator_regex = "_machine_(?:continuation|topical|specified)_(.+)$"
domain_column = "src"
domain_regex = "^(.+?)_(?:human|machine)"
min_chars = 100
take = { each = 40000 }

[[source]]
name = "HC3"
loader = "answers"
repo = "Hello-SimpleAI/HC3"                                                                                                                                     # human answers vs ChatGPT (Dec 2022) to the same questions
files = { finance = "finance.jsonl", medicine = "medicine.jsonl", open_qa = "open_qa.jsonl", reddit_eli5 = "reddit_eli5.jsonl", wiki_csai = "wiki_csai.jsonl" }
human = "human_answers"
ai = "chatgpt_answers"
generator = "gpt-3.5-turbo"
detokenise = true                                                                                                                                               # the human answers come pre-tokenised ("it 's", "there .")
flatten_paragraphs = true                                                                                                                                       # the human answers in two of the five subsets have no paragraph breaks
trim_fragments = "end"                                                                                                                                          # half of the human medicine answers end without punctuation
min_chars = 100
take = { each = 25000 }

[[source]]
name = "detection-pile"
loader = "files"
repo = "artem9k/ai-text-detection-pile" # human web text, stories and older machine text; generators unknown
files = ["data/*.parquet"]
label_column = "source"
human_value = "human"
detokenise = true                       # some of the human stories use PTB quotes (`` '')
trim_fragments = "end"                  # 30% of the human text ends mid-sentence (cut at a length limit), 4% of the AI text
min_chars = 200
take = { each = 60000 }

# ---------------------------------------------------------------------------------------------
# AI-vs-human continuation pairs (one human and one AI text per row)
# ---------------------------------------------------------------------------------------------

[[source]]
name = "ai-vs-human"
loader = "pairs"
repo = "ilyasoulk/ai-vs-human"
files = ["data/*.parquet"]
generator = "gpt-3.5-turbo"
domain = "cnn_dailymail"
trim_fragments = "start"          # both sides are continuations: many begin mid-sentence
ascii_quotes = true               # one side uses curly quotes, the other does not
detokenise = true                 # the human side keeps the Daily Mail "By . Name ." byline spacing
remove_pattern = "[\u00bb\u2022]" # Daily Mail "read more" and bullet characters on the human side
take = "all"
flatten_paragraphs = true


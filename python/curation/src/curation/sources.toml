# Sources for the curated human/AI text dataset. Label 0 is human, 1 is AI.
#
# Every source is plain files in a Hugging Face (or Kaggle) dataset repo. `files` lists names or
# patterns (`data/*.parquet`); as a table (`name = files`) each name labels its files in the
# `dataset` column.
#
# `take` is how many rows of the source go into the dataset; the settings below cut them into train,
# test and validation in the same proportions for every source, so each split has the same mix:
#   "all"                    every row            { each = n }       up to n rows of each label
#   n                        n rows in total      { 0 = n, 1 = "all" }  explicit per label
# `holdout = true` keeps a source out of training entirely: all its rows go to `holdout.parquet`
# (for small benchmark sets), and any row that resembles training data is dropped.
#
# `generator` is the model that wrote the AI text (constant, column, or a regex on a column); it is
# only kept on AI rows. `group_column` keeps rows that are variants of one document in the same split.
#
# Repairs for collection artefacts (never for what the author wrote): `unwrap_lines`, `detokenise`,
# `flatten_paragraphs` (when the human and AI sides of a source differ in paragraph breaks only
# because of how it was collected), `drop_pattern` (a contamination filter) and `min_chars`.
#
# Human text must be certainly human: before late 2022 (ChatGPT), or by construction. Text from after
# that needs a filter or a reason, and sits in its own source so it can be dropped on its own.

[settings]
seed = 42
train = 0.70
test = 0.15
validation = 0.15
prefix_chars = 200 # a test/validation/holdout row sharing this many leading characters with an earlier split is dropped

# ---------------------------------------------------------------------------------------------
# Human text
# ---------------------------------------------------------------------------------------------

[[source]]
name = "english_quotes"
loader = "files"
repo = "Abirate/english_quotes"
files = ["quotes.jsonl"]
text_column = "quote"
label = 0
take = "all"

[[source]]
name = "newswire"
loader = "files"
repo = "dell-research-harvard/newswire" # public-domain US newswire articles, 1878-1977
files = ["*_data_clean.json"]
text_column = "cleaned_article"
label = 0
take = 50000

[[source]]
name = "rotten_tomatoes"
loader = "files"
repo = "cornell-movie-review-data/rotten_tomatoes"
files = ["*.parquet"]
label = 0
take = 7500
detokenise = true                                  # pre-tokenised: "the film 's ..."

[[source]]
name = "ag_news"
loader = "files"
repo = "fancyzhx/ag_news"
files = ["data/*.parquet"]
label = 0
take = 20000

[[source]]
name = "imdb"
loader = "files"
repo = "stanfordnlp/imdb"
files = ["plain_text/*.parquet"]
label = 0
take = 10000

[[source]]
name = "human-essays"
loader = "files"
repo = "artfultom/human-essays"
files = { "asap2 essays" = "asap2_essays.csv", "ivy panda essays" = "ivy_panda_essays.csv", "persuade essays" = "persuade_essays.csv" }
label = 0
take = 40000                                                                                                                            # across the three subsets; avoids topic over-fitting

# Human text from before ChatGPT (Dec 2022), or filtered. Each of these is certainly or very probably human.

[[source]]
name = "stackexchange"
loader = "stackexchange"
repo = "HuggingFaceH4/stack-exchange-preferences"
sites = [
    "english.stackexchange.com",
    "history.stackexchange.com",
    "law.stackexchange.com",
    "cooking.stackexchange.com",
    "travel.stackexchange.com",
    "workplace.stackexchange.com",
    "philosophy.stackexchange.com",
    "politics.stackexchange.com",
    "skeptics.stackexchange.com",
    "academia.stackexchange.com",
    "worldbuilding.stackexchange.com",
    "rpg.stackexchange.com",
    "scifi.stackexchange.com",
    "ell.stackexchange.com",
    "christianity.stackexchange.com",
    "judaism.stackexchange.com",
    "islam.stackexchange.com",
    "buddhism.stackexchange.com",
    "hinduism.stackexchange.com",
    "parenting.stackexchange.com",
    "movies.stackexchange.com",
    "interpersonal.stackexchange.com",
    "linguistics.stackexchange.com",
    "literature.stackexchange.com",
    "money.stackexchange.com",
    "economics.stackexchange.com",
    "health.stackexchange.com",
    "fitness.stackexchange.com",
    "outdoors.stackexchange.com",
    "pets.stackexchange.com",
    "gardening.stackexchange.com",
] # prose-heavy sites; the best-scored answer to each question asked before ChatGPT, no code
before = "2022/12/01"
domain_column = "site"
min_score = 1
min_chars = 200
take = 60000

[[source]]
name = "arxiv-abstracts"
loader = "files"
repo = "gfissore/arxiv-abstracts-2021" # a 2021 snapshot: all human
files = ["arxiv-abstracts.jsonl.gz"]
text_column = "abstract"
label = 0
domain = "scientific_abstract"
unwrap_lines = true                    # the abstracts are hard-wrapped at about 80 characters
min_chars = 200
take = 30000

[[source]]
name = "oasst2-prompter"
loader = "files"
repo = "OpenAssistant/oasst2"
files = ["data/*.parquet"]
keep = { lang = [
    "en",
], role = [
    "prompter",
], deleted = [
    false,
] } # volunteers writing prompts (2023)
label = 0
domain = "chat_prompt"
min_chars = 30
take = "all"

# TRIAL: written by volunteers in an assistant register (about 10% mention ChatGPT-style phrasing,
# so some are likely pasted from models). Strong AI phrases are dropped; the rest is treated as human.
[[source]]
name = "oasst2-assistant"
loader = "files"
repo = "OpenAssistant/oasst2"
files = ["data/*.parquet"]
keep = { lang = ["en"], role = ["assistant"], deleted = [false] }
label = 0
domain = "chat_assistant"
drop_pattern = "(?i)\\b(as an ai|as a language model|language model|i'?m sorry,? but|i apologi[sz]e|openai|chatgpt|gpt-?[34]|large language)\\b"
min_chars = 100
take = 20000


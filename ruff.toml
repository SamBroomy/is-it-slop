line-length = 120
show-fixes = true
src = ["python/"]
extend-include = ["notebooks/*.ipynb", "notebooks/*.py"]
# exclude = ["python/**/tests/**", "python/**/test_*.py"]

[lint]
preview = true
select = ["ALL"]
ignore = [
    # --- modules ---
    "CPY",                   # Flake8-copyright
    "non-empty-init-module", # non-empty-init-module
    # # --- specific rules ---
    # "ASYNC240", # Async functions should not use pathlib.Path methods
    # "N999",     # Invalid module name
    "missing-trailing-comma", # Commas should be used to separate items in a list
    # "D100",     # Missing docstring in public module
    # "D101",     # Missing docstring in public class
    # "D102",     # Missing docstring in public method
    # "D103",     # Missing docstring in public function
    # "D104",     # Missing docstring in public package
    # "D105",     # Missing docstring in magic method
    # "D107",     # Missing docstring in __init__
    "incorrect-blank-line-before-class", # 1 blank line required before class docstring
    "multi-line-summary-second-line",    # Multi-line docstring closing quotes should be on a separate line
    # "D401",   # First line should be in imperative mood
    # "DOC201", # Return is not documented in the docstring
    # "DOC501", # Raised exception missing from docstring
    # "ERA001", # Found commented-out code
    # "S404",   # Use of subprocess module is possibly insecure
    # "TRY003", # Try/except block does not specify the exception type

    # "T201", # Use of print detected
]
[lint.isort]
split-on-trailing-comma = false

[lint.per-file-ignores]
"python/curation/src/**" = [
    "docstring-missing-returns",   # one-line summaries plus type hints say enough here
    "docstring-missing-exception",
    "import-outside-top-level",    # datasets, kagglehub, huggingface_hub and the Rust bindings load lazily on purpose
]
"python/curation/src/curation/cli.py" = [
    "print", # the command line reports its result on stdout
]
"scripts/**" = ["docstring-missing-returns", "print"]
"python/**/tests/**" = [
    "implicit-namespace-package",         # test folders are not packages (one pytest run covers several)
    "import-outside-top-level",           # tests import what they exercise lazily
    "undocumented-public-module",         # Missing docstring in public module
    "undocumented-public-class",          # Missing docstring in public class
    "undocumented-public-method",         # Missing docstring in public method
    "undocumented-public-function",       # Missing docstring in public function
    "undocumented-public-package",        # Missing docstring in public package
    "docstring-missing-returns",          # Return is not documented in the docstring
    "commented-out-code",                 # Commented-out code
    "shebang-not-executable",             # Shebang is present but file is not executableetected
    "boolean-positional-value-in-call",   # Boolean position value in function
    "invalid-argument-name",              # Argument name should be lowercase
    "non-lowercase-variable-in-function", # Variable in function should be lowercase
    "too-many-locals",                    # Too many branches in function
    "too-many-statements",                # Too many statements in function
    "magic-value-comparison",             # Magic value
    "print",                              # Use of print detected
    "assert",                             # Use of assert detected
    "suspicious-pickle-usage",            # Use of unsafe pickle load detected
    "suspicious-pickle-import",           # Use of insecure pickle module
    "float-equality-comparison",
    "no-self-use",
    "pytest-raises-too-broad",
]


[format]
docstring-code-format = true
preview = true
skip-magic-trailing-comma = true

[lint.pylint]
max-args = 10

[lint.mccabe]
max-complexity = 12

[lint.pycodestyle]
max-line-length = 150
